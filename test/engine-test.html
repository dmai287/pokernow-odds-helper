<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Engine tests</title>
  <style>
    body { font: 13px monospace; background:#12161c; color:#e8edf2; padding:16px; }
    .pass { color:#6fe79f; } .fail { color:#ff8b8b; font-weight:bold; }
    h2 { color:#9aa7b4; }
  </style>
</head>
<body>
  <h2>PokerNow Odds Helper — engine tests</h2>
  <div id="out"></div>
  <!-- engine modules attach to window.PNO -->
  <script src="../src/poker/cards.js"></script>
  <script src="../src/poker/evaluator.js"></script>
  <script src="../src/poker/equity.js"></script>
  <script src="../src/poker/decision.js"></script>
  <script src="../src/poker/draws.js"></script>
  <script src="../src/poker/ranges.js"></script>
  <script src="../src/poker/preflop.js"></script>
  <script src="../src/poker/leaks.js"></script>
  <script src="../src/poker/coach.js"></script>
  <script src="../src/content/history.js"></script>
  <script>
    const { parseCard } = PNO.cards;
    const { evaluate } = PNO.evaluator;
    const { monteCarlo, potOdds, callEV } = PNO.equity;
    const { decide } = PNO.decision;
    const { analyze } = PNO.draws;
    const { topPercent, handKey, inRange, tightnessFromAction } = PNO.ranges;
    const out = document.getElementById('out');
    let passed = 0, failed = 0;

    const C = (s) => s.split(' ').map(parseCard);

    function ok(cond, label) {
      const div = document.createElement('div');
      div.className = cond ? 'pass' : 'fail';
      div.textContent = (cond ? '✓ ' : '✗ FAIL ') + label;
      out.appendChild(div);
      cond ? passed++ : failed++;
    }
    function approx(actual, expected, tol, label) {
      ok(Math.abs(actual - expected) <= tol, `${label} (got ${actual.toFixed(3)}, expect ~${expected})`);
    }

    // --- parsing ---
    ok(parseCard('As').rank === 14 && parseCard('As').suit === 0, 'parse As');
    ok(parseCard('10h').rank === 10 && parseCard('10h').suit === 1, 'parse 10h');
    ok(parseCard('T♦').rank === 10 && parseCard('T♦').suit === 2, 'parse T♦');
    ok(parseCard('zz') === null, 'reject garbage');

    // --- hand ranking order ---
    const royal      = evaluate(C('As Ks Qs Js Ts 2h 3d'));
    const quads      = evaluate(C('9c 9d 9h 9s Ks 2h 3d'));
    const fullHouse  = evaluate(C('9c 9d 9h Ks Kd 2h 3s'));
    const flush      = evaluate(C('As Js 9s 6s 3s 2h Kd'));
    const straight   = evaluate(C('5c 6d 7h 8s 9c 2h Kd'));
    const trips      = evaluate(C('9c 9d 9h Ks Qd 2h 3s'));
    const twoPair    = evaluate(C('9c 9d Ks Kd 2h 3s 4c'));
    const onePair    = evaluate(C('9c 9d Ks Qd 2h 3s 4c'));
    const highCard   = evaluate(C('9c 7d Ks Qd 2h 3s 5c'));
    ok(royal > quads, 'straight flush > quads');
    ok(quads > fullHouse, 'quads > full house');
    ok(fullHouse > flush, 'full house > flush');
    ok(flush > straight, 'flush > straight');
    ok(straight > trips, 'straight > trips');
    ok(trips > twoPair, 'trips > two pair');
    ok(twoPair > onePair, 'two pair > one pair');
    ok(onePair > highCard, 'one pair > high card');

    // --- wheel straight (A-2-3-4-5) ---
    const wheel = evaluate(C('Ah 2d 3c 4s 5h Kd Qc'));
    ok(wheel > onePair && wheel < flush, 'wheel counts as a straight');
    // 6-high straight beats the wheel
    ok(evaluate(C('2h 3d 4c 5s 6h Kd Qc')) > wheel, '6-high straight > wheel');

    // --- kickers ---
    ok(evaluate(C('As Ad Ks 7d 5c 2h 3s')) > evaluate(C('As Ad Qs 7d 5c 2h 3s')),
       'AA with K kicker > AA with Q kicker');

    // --- known equities (Monte Carlo, generous tolerance) ---
    // AA vs 1 random hand preflop ≈ 0.85
    const aa = monteCarlo(C('As Ah'), [], 1, 8000);
    approx(aa.equity, 0.85, 0.03, 'AA vs 1 random preflop');
    // 72o vs 1 random hand preflop ≈ 0.35
    const seven2 = monteCarlo(C('7c 2d'), [], 1, 8000);
    approx(seven2.equity, 0.35, 0.04, '72o vs 1 random preflop');
    // AKs vs 1 random preflop ≈ 0.67
    const aks = monteCarlo(C('As Ks'), [], 1, 8000);
    approx(aks.equity, 0.67, 0.04, 'AKs vs 1 random preflop');
    // Made nut flush on the river = ~1.0 vs 1 opponent who can't beat it
    const madeFlush = monteCarlo(C('As Ks'), C('Qs Js Ts 2h 3d'), 1, 3000);
    approx(madeFlush.equity, 1.0, 0.001, 'royal flush on river = 100%');

    // --- pot odds ---
    approx(potOdds(100, 50), 1/3, 0.0001, 'pot 100 call 50 → 33.3%');
    approx(potOdds(150, 50), 0.25, 0.0001, 'pot 150 call 50 → 25%');

    // --- expected value of a call (chips) ---
    approx(callEV(0.5, 100, 50), 25, 0.0001, 'EV: 50% equity, pot 100, call 50 → +25');
    approx(callEV(1 / 3, 100, 50), 0, 0.0001, 'EV: breakeven equity → 0');
    approx(callEV(0.2, 100, 50), -20, 0.0001, 'EV: 20% equity, pot 100, call 50 → −20');

    // --- decision engine ---
    // facing a bet, equity below pot odds → fold
    ok(decide({ equity: 0.20, pot: 100, call: 50 }).action === 'Fold',
       'low equity vs bet → Fold');
    // facing a bet, equity above pot odds → call
    ok(decide({ equity: 0.45, pot: 100, call: 50, opponents: 1 }).action === 'Call',
       'enough equity vs bet → Call');
    // huge edge vs a bet → raise
    ok(decide({ equity: 0.85, pot: 100, call: 20 }).action === 'Raise',
       'big edge vs bet → Raise');
    // just short of pot odds → close fold
    ok(decide({ equity: 0.30, pot: 100, call: 50 }).action === 'Fold (close)',
       'just short of pot odds → Fold (close)');
    // no bet to call, strong equity → bet
    ok(decide({ equity: 0.70, pot: 100, call: 0 }).action === 'Bet',
       'strong equity, no bet → Bet');
    // no bet to call, weak equity → check
    ok(['Check', 'Check / give up'].includes(decide({ equity: 0.35, pot: 100, call: 0 }).action),
       'weak equity, no bet → Check');
    // no cards → neutral placeholder
    ok(decide({ equity: null }).tone === 'neutral', 'no cards → neutral');

    // --- position adjustment ---
    // equity 0.35 vs pot 100 / call 50 (breakeven 33.3%): marginal spot
    ok(decide({ equity: 0.35, pot: 100, call: 50 }).action === 'Call',
       'marginal spot, unknown position → Call');
    ok(decide({ equity: 0.35, pot: 100, call: 50, inPosition: false }).action.startsWith('Fold'),
       'same spot out of position → Fold');
    ok(decide({ equity: 0.35, pot: 100, call: 50, inPosition: true }).action === 'Call',
       'same spot in position → Call');
    // position tag appears in the reasoning
    ok(/out of position/.test(decide({ equity: 0.45, pot: 100, call: 50, inPosition: false }).reason),
       'reason notes out of position');

    // --- bet / raise sizing ---
    // bet: very strong → ~3/4 pot
    ok(decide({ equity: 0.80, pot: 200, call: 0 }).size.chips === 150,
       'bet sizing: 80% equity into 200 pot → 150 (¾ pot)');
    // bet: good value → ~2/3 pot
    ok(decide({ equity: 0.65, pot: 300, call: 0 }).size.chips === 198,
       'bet sizing: 65% equity into 300 pot → 198 (⅔ pot)');
    // raise: huge edge → pot-sized (call + (pot+call))
    ok(decide({ equity: 0.80, pot: 300, call: 60 }).size.chips === 420,
       'raise sizing: pot-sized = call 60 + (300+60) = 420');
    // call and fold carry no sizing
    ok(decide({ equity: 0.40, pot: 100, call: 50 }).size == null, 'call has no size');
    ok(decide({ equity: 0.10, pot: 100, call: 50 }).size == null, 'fold has no size');

    // --- semi-bluff / fold equity ---
    const rfe = PNO.decision.requiredFoldEquity;
    approx(rfe(66, 100), 0.398, 0.005, 'fold equity: ⅔-pot bet needs ~40% folds');
    approx(rfe(100, 100), 0.5, 0.001, 'fold equity: pot-sized bet needs 50% folds');
    ok(rfe(0, 100) === null, 'fold equity: no bet → null');
    // strong draw, no value yet, nothing to call → semi-bluff bet
    const sb = decide({ equity: 0.35, pot: 100, call: 0, outs: 9 });
    ok(sb.action === 'Bet (semi-bluff)' && sb.size.chips === 66,
       'strong draw, checked to → semi-bluff bet (⅔ pot)');
    // a made hand bets for value, not labelled a semi-bluff
    ok(decide({ equity: 0.70, pot: 100, call: 0, outs: 9 }).action === 'Bet',
       'made hand → value Bet, not semi-bluff');
    // a weak draw (gutshot) is not a semi-bluff
    ok(!/semi-bluff/.test(decide({ equity: 0.30, pot: 100, call: 0, outs: 4 }).action),
       'gutshot (4 outs) → not a semi-bluff');

    // --- draw / outs detection ---
    const fd = analyze(C('As Ks'), C('Qs 7s 2h'));
    ok(fd.draws.some(d => d.name === 'Flush draw' && d.outs === 9) && fd.outs === 9,
       'flush draw = 9 outs');
    const oesd = analyze(C('9h 8c'), C('7d 6s 2h'));
    ok(oesd.draws.some(d => d.name === 'Open-ended straight draw' && d.outs === 8) && oesd.outs === 8,
       'OESD = 8 outs');
    const gut = analyze(C('9h 8c'), C('6s 5d 2h'));
    ok(gut.draws.some(d => d.name === 'Gutshot' && d.outs === 4) && gut.outs === 4,
       'gutshot = 4 outs');
    const combo = analyze(C('9s 8s'), C('7s 6s 2c'));
    ok(combo.draws.length === 2 && combo.outs === 15,
       'flush + OESD combo = 15 outs (deduped)');
    ok(analyze(C('As Kd'), C('2c 7h Js')).outs === 0, 'no draw = 0 outs');
    ok(analyze(C('9s 8s'), C('7s 6s 2c 3h Kd')).draws.length === 0, 'no draws on the river');
    ok(analyze(C('As Ks'), C('Qs Js Ts')).draws.length === 0, 'made straight = no draw');

    // --- ranges ---
    ok(handKey(parseCard('As'), parseCard('Ah')) === '14-14-p', 'handKey pair');
    ok(handKey(parseCard('As'), parseCard('Ks')) === '14-13-s', 'handKey suited');
    ok(handKey(parseCard('As'), parseCard('Kh')) === '14-13-o', 'handKey offsuit');
    ok(topPercent(1) === null, 'top 100% = null (any two cards)');
    const top5 = topPercent(0.05), top20 = topPercent(0.20);
    ok(top5.has('14-14-p'), 'AA in top 5%');
    ok(!top5.has('7-2-o'), '72o not in top 5%');
    ok([...top5].every((k) => top20.has(k)), 'top 5% is a subset of top 20%');
    ok(inRange(top20, parseCard('As'), parseCard('Ks')), 'AKs in top 20%');
    ok(!inRange(top5, parseCard('9c'), parseCard('4d')), '94o not in top 5%');
    // Range-based equity: AA's equity is lower vs a tight range than vs random hands.
    const aaRandom = monteCarlo(C('As Ah'), [], 1, 8000, null).equity;
    const aaTight = monteCarlo(C('As Ah'), [], 1, 8000, topPercent(0.10)).equity;
    ok(aaRandom - aaTight > 0.01,
       `AA equity lower vs tight range (rand ${aaRandom.toFixed(3)} > tight ${aaTight.toFixed(3)})`);

    // --- auto range from action (bet size → tightness) ---
    ok(tightnessFromAction(100, 0, 0) === 0.60, 'preflop limp → wide (60%)');
    ok(tightnessFromAction(150, 0, 3) === 0.65, 'checked flop → wide (65%)');
    ok(tightnessFromAction(130, 30, 3) === 0.50, 'small bet (~0.3 pot) → top 50%');
    ok(tightnessFromAction(160, 60, 3) === 0.35, 'half-pot bet → top 35%');
    ok(tightnessFromAction(200, 100, 3) === 0.22, 'pot-sized bet → top 22%');
    ok(tightnessFromAction(300, 200, 3) === 0.12, 'overbet → top 12%');
    // bigger bets imply tighter ranges (monotonic)
    ok(tightnessFromAction(300, 200, 3) < tightnessFromAction(130, 30, 3),
       'bigger bet ⇒ tighter range');

    // --- per-villain ranges (array form of monteCarlo) ---
    // Use a range-sensitive hand: KJo is crushed by a tight range, fine vs a loose one.
    const r10 = topPercent(0.10), r80 = topPercent(0.80);
    const kjTight = monteCarlo(C('Ks Jd'), [], 2, 6000, [r10, r10]).equity;
    const kjLoose = monteCarlo(C('Ks Jd'), [], 2, 6000, [r80, r80]).equity;
    const kjMixed = monteCarlo(C('Ks Jd'), [], 2, 6000, [r10, r80]).equity;
    ok(kjLoose - kjTight > 0.03,
       `KJo equity much lower vs tight ranges (tight ${kjTight.toFixed(3)} < loose ${kjLoose.toFixed(3)})`);
    ok(kjMixed > 0 && kjMixed < 1, 'mixed per-villain range returns a valid equity');

    // --- implied odds (draw makes a −EV call playable when stacks are deep) ---
    // equity 30% vs pot 100 / call 50 (breakeven 33.3%) — folds without a draw...
    ok(decide({ equity: 0.30, pot: 100, call: 50 }).action.startsWith('Fold'),
       '−EV with no draw → Fold');
    // ...but a 9-out draw with a deep stack behind → Call (implied)
    ok(decide({ equity: 0.30, pot: 100, call: 50, outs: 9, effStack: 1000 }).action === 'Call (implied)',
       '−EV draw with deep stack → Call (implied)');
    // a draw but almost no stack behind → still Fold (no implied odds)
    ok(decide({ equity: 0.20, pot: 100, call: 50, outs: 9, effStack: 10 }).action.startsWith('Fold'),
       '−EV draw with no stack behind → Fold');

    // --- leak report ---
    const leakHands = [
      { position: 'Big blind', inPosition: false, street: 'river', action: 'Call', ev: -30, net: -100, hero: ['As','Kd'], board: ['2c','3d','4h','5s','9c'] },
      { position: 'Button', inPosition: true, street: 'flop', action: 'Bet → 50', ev: null, net: 120 },
      { position: 'Big blind', inPosition: false, street: 'river', action: 'Call', ev: -20, net: -50, hero: ['Qh','Jc'], board: ['2c','3d','4h','5s','Kc'] },
      { position: 'Cutoff', inPosition: true, street: 'turn', action: 'Raise → 200', ev: null, net: 200 },
    ];
    const lr = PNO.leaks.analyze(leakHands);
    ok(lr.count === 4 && lr.netTotal === 170, 'leak report: count and net total');
    ok(lr.minusEvCalls.count === 2 && lr.minusEvCalls.evLost === -50, 'leak report: −EV calls tallied');
    ok(Math.round(lr.oop.netPerHand) === -75 && Math.round(lr.ip.netPerHand) === 160,
       'leak report: OOP loses, IP wins');
    ok(lr.aggression.ratioPct === 50, 'leak report: aggression 50%');
    ok(lr.byPosition[0].position === 'Big blind', 'leak report: worst position first');
    ok(lr.worstHands[0].net === -100, 'leak report: biggest loss surfaced');
    ok(lr.tips.some((t) => /out of position/.test(t)), 'leak report: OOP tip generated');
    ok(PNO.leaks.analyze([]).count === 0, 'leak report: empty input handled');

    // --- coach (learns from your history) ---
    const coachHands = [];
    for (let i = 0; i < 12; i++) coachHands.push({ position: 'Big blind', inPosition: false, street: 'river', action: 'Call', ev: -20, net: -50 });
    for (let i = 0; i < 4; i++) coachHands.push({ position: 'Button', inPosition: true, street: 'flop', action: 'Bet → 50', ev: null, net: 40 });
    const cp = PNO.coach.profile(coachHands);
    ok(cp.ready && cp.overCallsRiver && cp.leaksOOP && cp.tooPassive, 'coach: profile flags all three leaks');
    ok(/over-call rivers/.test(PNO.coach.note(cp, { street: 'river', action: 'Call', inPosition: false }) || ''),
       'coach: river over-call nudge');
    ok(/out of position/.test(PNO.coach.note(cp, { street: 'flop', action: 'Call', inPosition: false }) || ''),
       'coach: out-of-position nudge');
    ok(/passively/.test(PNO.coach.note(cp, { street: 'flop', action: 'Check', inPosition: true }) || ''),
       'coach: passive-play nudge');
    ok(PNO.coach.profile([]).ready === false, 'coach: not ready with too few hands');
    ok(PNO.coach.note(PNO.coach.profile([]), { street: 'river', action: 'Call' }) === null,
       'coach: no note before enough hands');

    // --- history street naming ---
    const sn = PNO.history.streetName;
    ok(sn(0) === 'preflop' && sn(3) === 'flop' && sn(4) === 'turn' && sn(5) === 'river',
       'streetName maps board length to street');

    // --- preflop advice ---
    const adv = PNO.preflop.advise;
    const hp = PNO.ranges.handPercentile;
    ok(hp(parseCard('As'), parseCard('Ah')) < hp(parseCard('Ks'), parseCard('Qh')),
       'AA has a stronger percentile than KQo');
    const aaH = C('As Ah'), trash = C('7c 2d');
    ok(adv({ hole: aaH, position: 'Early/Middle', call: 0 }).action === 'Raise',
       'AA open-raises from early position');
    ok(adv({ hole: aaH, position: 'Button', call: 200, bb: 20 }).action === 'Raise',
       'AA 3-bets facing a raise');
    ok(adv({ hole: trash, position: 'Button', call: 0 }).action === 'Fold',
       '72o folds on the button (unraised)');
    ok(adv({ hole: trash, position: 'Big blind', call: 0 }).action === 'Check',
       '72o checks the big-blind option');
    ok(adv({ hole: trash, position: 'Early/Middle', call: 200 }).action === 'Fold',
       '72o folds facing a raise');
    // Button opens at least as wide as early position for any hand.
    const mid = C('Ks 9s');
    const epAct = adv({ hole: mid, position: 'Early/Middle', call: 0 }).action;
    const btnAct = adv({ hole: mid, position: 'Button', call: 0 }).action;
    ok(!(epAct === 'Raise' && btnAct !== 'Raise'), 'Button opens at least as wide as early');

    const summary = document.createElement('h2');
    summary.innerHTML = `<br>${passed} passed, ${failed} failed`;
    summary.style.color = failed ? '#ff8b8b' : '#6fe79f';
    out.appendChild(summary);
    document.title = failed ? `FAIL (${failed})` : `PASS (${passed})`;
    window.__results = { passed, failed };
  </script>
</body>
</html>
